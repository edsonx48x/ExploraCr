# Compila la app de Android en los servidores de GitHub (no hace falta Android Studio).
# Para correrlo: pestaña Actions → "Android APK" → Run workflow. Al terminar,
# el archivo app-debug.apk queda en "Artifacts", al final de esa ejecución.
name: Android APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run web
      - run: npx cap add android
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: ExploraCR-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
